<style>
:root{--ink:#14183a;--muted:#6b7090;--purple:#5b3df5;--pink:#e830e8;--blue:#2f45ff;--bg:#f6f5fc;--card:#fff;--line:#e9e8f3;--w:430px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}

button,select,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.app{max-width:var(--w);min-height:100vh;margin:0 auto;background:var(--bg);position:relative;padding-bottom:84px;overflow:hidden}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.search{margin:-46px 14px 0;background:#fff;border-radius:22px;padding:14px;box-shadow:0 14px 40px rgba(40,30,120,.16);position:relative;z-index:3}
.field{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;height:48px;margin-bottom:10px;background:#fff}

.go{width:100%;height:50px;border-radius:14px;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(90deg,#2f45ff,#e830e8);box-shadow:0 8px 20px rgba(120,50,255,.35)}

.cities{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.cities::-webkit-scrollbar{display:none}
.city{flex:0 0 96px;height:96px;border-radius:14px;color:#fff;font-size:12px;font-weight:700;position:relative;overflow:hidden;border:2px solid transparent;padding:0;background:#2a1d6e;transition:transform .15s}
.city:active{transform:scale(.96)}
.city img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.city span{position:absolute;left:0;right:0;bottom:7px;z-index:2;text-align:center}
.city.on{border-color:var(--purple)}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
.cgrid .city{width:100%;height:120px;flex:none}
.cgrid .city span{font-size:14px}
.note{margin:0 16px 8px;font-size:11.5px;color:var(--muted)}
.list{padding:0 14px;display:grid;gap:10px}
.room{display:flex;gap:12px;background:#fff;border-radius:16px;padding:8px;box-shadow:0 4px 16px rgba(40,30,120,.06)}
.pic{flex:0 0 126px;height:112px;border-radius:12px;position:relative;overflow:hidden}

.heart{position:absolute;top:7px;right:7px;color:#fff}

.heart.on svg{fill:#ff3d77;stroke:#ff3d77}
.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:2px 2px 2px 0}
.info h3{margin:0;font-size:15px;font-weight:700}

.tags{display:flex;gap:6px;flex-wrap:wrap}

.row{display:flex;justify-content:space-between;align-items:center}
.rate{font-size:12.5px;font-weight:700}

.page{padding:22px 16px 8px}
.page h2{margin:0 0 14px;font-size:22px;font-weight:800}
.page p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 10px}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
.toast{position:fixed;bottom:96px;left:50%;transform:translate(-50%,20px);background:#14183a;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.prof{display:grid;gap:10px}
.prof div{background:#fff;border-radius:14px;padding:14px;font-weight:600}
/* interactive map */
.map-wrap{padding:0 14px 18px}.map-toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:0 0 10px}.map-toolbar select{min-width:0;flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:#fff}.map-canvas{height:390px;border-radius:18px;overflow:hidden;background:#e9e7f5;z-index:1}.map-note{font-size:12px;color:var(--muted);padding:8px 2px}.map-link{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:11px;font-weight:700;color:var(--purple);text-decoration:none;background:#fff}.coord-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.map-actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
/* filters */
.fp{margin:0 14px;background:#fff;border-radius:22px;padding:14px;box-shadow:0 14px 40px rgba(40,30,120,.12)}
.fp h4{margin:6px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1.5px solid var(--line);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600;background:#fff}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}
.btns .go{height:46px}
.ghost{height:46px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;background:#fff}
.sortbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 16px 10px;font-size:13px;font-weight:600}
.sortbar select{border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff;font-size:13px}
.spin{width:30px;height:30px;border:3px solid #e1ddf8;border-top-color:var(--purple);border-radius:50%;margin:40px auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:112px;border-radius:16px;background:linear-gradient(90deg,#ece9fa,#f7f5ff,#ece9fa);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* drawer + sheet */
.ov{position:fixed;inset:0;background:rgba(20,14,60,.55);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.ov.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:max(0px,calc(50% - var(--w)/2));width:min(310px,86vw);background:#fff;z-index:21;transform:translateX(-105%);transition:transform .25s;display:flex;flex-direction:column;visibility:hidden}
.drawer.show{transform:none;visibility:visible}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;background:linear-gradient(120deg,#2a1d6e,#7a3fc0);color:#fff}
.dh .logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800}
.dh button{color:#fff}
.dn{overflow-y:auto;flex:1;padding:8px 8px 24px;overscroll-behavior:contain}
.dn button{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;font-weight:600;font-size:15px}
.dn button:active,.dn button:hover{background:#f1effb}
.dn hr{border:0;border-top:1px solid var(--line);margin:8px 6px}
.dn .lg{display:flex;gap:8px;padding:10px 14px}
.dn .lg button{width:auto;padding:8px 16px;border:1.5px solid var(--line);border-radius:20px;font-size:14px}
.dn .lg button.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:var(--w);background:#fff;border-radius:22px 22px 0 0;z-index:22;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));transition:transform .25s;visibility:hidden;max-height:70vh;overflow-y:auto}
.sheet.show{transform:translate(-50%,0);visibility:visible}
.sheet h3{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.nt{padding:12px;border-radius:12px;background:#f6f5fc;margin-bottom:8px;font-size:14px}
.nt.u{border-left:4px solid var(--purple)}
body.lock{overflow:hidden}
.demo{background:#fff6dd;border:1px solid #f1d98a;color:#6b5200;border-radius:12px;padding:10px 12px;font-size:12.5px;margin:0 0 12px;line-height:1.45}
.odh{display:flex;align-items:center;gap:10px;padding:14px 14px 0;font-weight:800;font-size:17px}.odh button{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#fff}
.od{padding:14px 14px 8px}.onav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.onav::-webkit-scrollbar{display:none}
.onav button{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px}
.onav button.on{background:var(--purple);border-color:var(--purple);color:#fff}.onav .lo{color:#c0224f;border-color:#f3c3d0}
.oc{min-width:0}.oc h3{margin:14px 0 8px;font-size:17px}.oc .list{padding:0}
.ostats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.ostats div{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 16px rgba(40,30,120,.06)}
.ostats b{display:block;font-size:24px}.ostats span{font-size:12px;color:var(--muted);font-weight:600}
.pill{display:inline-block;border-radius:10px;padding:3px 9px;font-size:11px;font-weight:700;background:#eee;white-space:nowrap}
.pill.pending{background:#fff1d6;color:#8a5a00}.pill.accepted{background:#dff5ea;color:#0f7a45}.pill.rejected{background:#ffe3e8;color:#b0214a}.pill.cancelled{background:#ececf3;color:#555}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.acts button,.acts select{border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;background:#fff}.acts .dng,.dng{color:#c0224f;border-color:#f3c3d0}
.acts .book{background:var(--purple);border-color:var(--purple);color:#fff}
/* My Profile (logged-in) */
.pf{padding:18px 16px 8px}.pf-h{margin:0 0 14px;font-size:22px;font-weight:800}
.pf-hd{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 16px rgba(40,30,120,.06);margin-bottom:12px}
.pf-avw{position:relative;display:block;flex:0 0 auto;cursor:pointer}
.pf-av{position:relative;display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#7a5bff,#c13bff);color:#fff;font-size:28px;font-weight:800}

.pf-ro{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#f8f7fd;font-size:15px}.pf-ro span{flex:1;min-width:0;overflow-wrap:anywhere}.pf-ro svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}

.phs{display:flex;gap:8px;flex-wrap:wrap}.phs label{position:relative;cursor:pointer;border:2px solid transparent;border-radius:10px;overflow:hidden;width:72px;height:58px;margin:0}

<body>
<div class="app">
  <main id="view"><div class="spin" role="status" aria-label="Loading"></div></main>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';
/* ---------- Supabase: read-only connection test (no writes, no auth) ---------- */
try{
  if(!window.ROOMLY_SUPABASE_URL||!window.ROOMLY_SUPABASE_KEY){
    console.warn('[Alfrzo] Supabase config missing; continuing with demo data.');
  }else{
    var sbScript=document.createElement('script');
    sbScript.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
    sbScript.async=true;
    sbScript.onload=async function(){
      try{
        if(!window.supabase||typeof window.supabase.createClient!=='function'){console.error('[Alfrzo] Supabase client failed to load.');authOff();return}
        if(keyIsSecret(window.ROOMLY_SUPABASE_KEY)){console.error('[Alfrzo] Refusing to use a service_role/secret key in the browser. Use the anon/publishable key only.');authOff();return}
        if(!window.supabaseClient){window.supabaseClient=window.supabase.createClient(window.ROOMLY_SUPABASE_URL,window.ROOMLY_SUPABASE_KEY)}
        authInit();
        const {count,error}=await window.supabaseClient.from('rooms').select('id',{count:'exact',head:true});
        if(error){console.error('[Alfrzo] Supabase read-only rooms check failed:',error)}
        else{console.log('[Alfrzo] Supabase read-only rooms check passed. Room count:',count)}
      }catch(e){console.error('[Alfrzo] Supabase check threw:',e&&e.message?e.message:e)}
    };
    sbScript.onerror=function(){console.error('[Alfrzo] Failed to load Supabase client from CDN.');authOff()};
    document.head.appendChild(sbScript);
  }
}catch(e){console.error('[Alfrzo] Supabase loader error:',e)}
