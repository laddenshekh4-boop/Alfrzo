/* Fallback art when a photo file is missing: a distinct skyline per city (not a flat gradient) */
function art(seed,w=200,h=200){let s=seed*9301+49297,r=()=>(s=(s*9301+49297)%233280)/233280,hue=(seed*47)%360,b='';
 for(let i=0,x=0;x<w;i++){const bw=18+r()*26,bh=40+r()*90;b+=`<rect x="${x}" y="${h-bh}" width="${bw-3}" height="${bh}" fill="hsl(${hue},35%,${22+r()*14}%)"/>`;for(let y=h-bh+8;y<h-6;y+=12)if(r()>.45)b+=`<rect x="${x+4}" y="${y}" width="4" height="5" fill="#ffd98a"/>`;x+=bw}
 return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${hue},55%,45%)"/><stop offset="1" stop-color="hsl(${(hue+40)%360},60%,70%)"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g)"/>${b}</svg>`)}
function img(file,seed,alt,extra=''){return `<img src="${IMG}${file}" alt="${alt}" ${extra} data-fb="${seed}" onerror="window.__fb(this)">`}
window.__fb=function(el){if(el.dataset.done)return;el.dataset.done=1;el.src=art(+el.dataset.fb)};

function matches(r,F){

 if(F.budget){const [a,b]=F.budget.split('-');if(r.p<+a||(b&&r.p>+b))return false}
 if(F.type&&r.type!==F.type)return false;if(F.furn&&r.furn!==F.furn)return false;if(F.food&&r.food!==F.food)return false;
 if(F.gender&&F.gender!=='Any'&&r.g!=='Any'&&r.g!==F.gender)return false;
 return F.am.every(a=>r.am.includes(a))}

const OT=[['over','overview'],['list','myList'],['book','bkMgmt'],['prof','oprof'],['rev','reviews'],['note','notif'],['earn','earn']];
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const thumb=r=>r.img?`<img src="${r.img}" alt="">`:img('room-'+(r.ph||1)+'.jpg',r.id%50+30,'');
function fg(l,id,inner){return `<div class="fg"><label for="${id}">${l}</label>${inner}<small class="ferr"></small></div>`}
const sel=(id,arr,v,lab)=>`<select id="${id}">${arr.map(k=>`<option value="${k}" ${k===v?'selected':''}>${lab?lab(k):t(k)}</option>`).join('')}</select>`;
function roomForm(){const n=S.edit==='new',r=n?{t:['',''],a:'',addr:'',c:'',p:'',dep:'',type:'Single',furn:'Furnished',food:'NotAvailable',g:'Any',am:[],desc:'',ph:1,pub:true,av:true,lat:'',lng:''}:S.or.find(x=>x.id===S.edit);
 if(!r){S.edit=null;return OV.list()}
 return `<h3>${t(n?'newRoom':'editRoom')}</h3><div class="card">${fg(t('fTitle'),'f_t',`<input id="f_t" maxlength="80" value="${esc(r.t[0])}">`)}${fg(t('fRent'),'f_p',`<input id="f_p" inputmode="numeric" value="${esc(r.p)}">`)}${fg(t('fDep'),'f_dep',`<input id="f_dep" inputmode="numeric" value="${esc(r.dep)}">`)}
 ${fg(t('city'),'f_c',`<select id="f_c"><option value="">${t('allC')}</option>${CITIES.map(c=>`<option value="${c[0]}" ${c[0]===r.c?'selected':''}>${c[L()]}</option>`).join('')}</select>`)}${fg(t('fLoc'),'f_a',`<input id="f_a" maxlength="60" value="${esc(r.a)}">`)}${fg(t('fAddr'),'f_addr',`<textarea id="f_addr" rows="2" maxlength="200">${esc(r.addr)}</textarea>`)}<div class="fg"><label>${t('mapLoc')}</label><div class="coord-grid"><input id="f_lat" inputmode="decimal" placeholder="${t('lat')} (e.g. 12.9716)" value="${esc(r.lat||'')}"><input id="f_lng" inputmode="decimal" placeholder="${t('lng')} (e.g. 77.5946)" value="${esc(r.lng||'')}"></div><div class="map-actions"><a class="map-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([r.addr,r.a,r.c,'India'].filter(Boolean).join(', '))}">${t('findMap')} ↗</a></div><small>Enter coordinates from Google Maps to place an exact pin. These fields are optional.</small></div>
 ${fg(t('type'),'f_type',sel('f_type',['Single','Double','Triple','Family','PG'],r.type))}${fg(t('furn'),'f_furn',sel('f_furn',FURN,r.furn))}${fg(t('food'),'f_food',sel('f_food',FOOD,r.food))}${fg(t('gender'),'f_g',sel('f_g',GEN,r.g))}
 <div class="fg"><label>${t('amen')}</label><div class="chips" id="o-am">${AMS.map(a=>`<button type="button" class="chip ${r.am.includes(a)?'on':''}" data-am="${a}" aria-pressed="${r.am.includes(a)}">${t(a)}</button>`).join('')}</div></div>
 ${fg(t('fDesc'),'f_desc',`<textarea id="f_desc" rows="3" maxlength="500">${esc(r.desc)}</textarea>`)}
 <div class="fg"><label>${t('fPhoto')}</label><div class="phs">${[1,2,3,4].map(i=>`<label><input type="radio" name="ph" value="${i}" ${(!S.tmpImg&&(r.ph||1)===i)?'checked':''}>${img('room-'+i+'.jpg',i+30,'')}</label>`).join('')}</div><label style="margin-top:8px">${t('fUp')}</label><input type="file" id="f_file" accept="image/png,image/jpeg,image/webp"><div id="f_prev">${S.tmpImg?`<img src="${S.tmpImg}" alt="" style="width:90px;border-radius:10px;margin-top:6px">`:''}</div></div>
 <label class="chk"><input type="checkbox" id="f_pub" ${r.pub?'checked':''}> ${t('fPub')}</label><label class="chk"><input type="checkbox" id="f_av" ${r.av!==false?'checked':''}> ${t('fAv')}</label>
 <div class="btns"><button class="ghost" data-ocancel>${t('cancel')}</button><button class="go" data-osave>${t('saveBtn')}</button></div></div>`}
function showErr(e){document.querySelectorAll('.ferr').forEach(x=>x.textContent='');for(const k in e){const x=$('#'+k);const s=x&&x.closest('.fg').querySelector('.ferr');if(s)s.textContent=t(e[k])}}
function saveRoom(){const g=i=>$('#'+i).value.trim(),e={},tt=g('f_t'),p=+g('f_p'),dp=g('f_dep')===''?NaN:+g('f_dep'),a=g('f_a'),ad=g('f_addr');
 if(tt.length<3)e.f_t='vTitle';if(!(g('f_p')!==''&&Number.isInteger(p)&&p>=500))e.f_p='vRent';if(!(Number.isInteger(dp)&&dp>=0))e.f_dep='vDep';if(!g('f_c'))e.f_c='vCity';if(a.length<2)e.f_a='vLoc';if(ad.length<10)e.f_addr='vAddr';
 showErr(e);if(Object.keys(e).length)return toast(t('fix'));
 const ph=+((document.querySelector('input[name=ph]:checked')||{}).value||1),am=[...document.querySelectorAll('#o-am .chip.on')].map(c=>c.dataset.am);
 const lat=g('f_lat'),lng=g('f_lng');const coordOK=(!lat&&!lng)||(Number.isFinite(+lat)&&Number.isFinite(+lng)&&Math.abs(+lat)<=90&&Math.abs(+lng)<=180);if(!coordOK){toast('Please enter valid latitude and longitude');return}const o={t:[tt,tt],a,addr:ad,c:g('f_c'),p,dep:dp,lat:lat?+lat:null,lng:lng?+lng:null,type:g('f_type'),furn:g('f_furn'),food:g('f_food'),g:g('f_g'),am,desc:g('f_desc'),ph,img:S.tmpImg||'',pub:$('#f_pub').checked,av:$('#f_av').checked,own:true};
 if(S.edit==='new'){o.id=Math.max(1000,...S.or.map(x=>x.id))+1;o.d=new Date().toISOString().slice(0,10);o.r=0;o.n=0;S.or.push(o);ev('Listing added: '+tt+(o.pub?' (published)':' (draft)'),'लिस्टिंग जोड़ी: '+tt,'o')}
 else{const r=S.or.find(x=>x.id===S.edit);Object.assign(r,o);ev('Listing updated: '+tt,'लिस्टिंग अपडेट: '+tt,'o')}
 S.edit=null;S.tmpImg='';persist();render();toast(t('saved2'))}
function delRoom(id){const r=S.or.find(x=>x.id===id);if(!r||!confirm(t('confDel')))return;
 S.or=S.or.filter(x=>x.id!==id);S.saved.delete(id);S.bookings.forEach(b=>{if(b.room===id&&active(b)){b.status='cancelled';ev('Your booking for '+b.title+' was cancelled (listing removed)',b.title+' की बुकिंग रद्द (लिस्टिंग हटी)','c')}});
 ev('Listing deleted: '+r.t[0],'लिस्टिंग डिलीट: '+r.t[0],'o');persist();render();toast(t('del'))}
const OV={
over(){const c=s=>S.bookings.filter(b=>b.status===s).length,st=[['tList',S.or.length],['tAct',S.or.filter(r=>r.pub&&r.av!==false).length],['tPend',c('pending')],['tConf',c('accepted')],['tCanc',c('cancelled')],['tRej',c('rejected')]],ac=ownNotes().slice(0,6);
 return `<div class="ostats">${st.map(([k,v])=>`<div><b>${v}</b><span>${t(k)}</span></div>`).join('')}</div><h3>${t('recent')}</h3>${ac.length?ac.map(x=>`<div class="nt">${esc(x.t[L()])}<br><small>${fdt(x.ts)}</small></div>`).join(''):`<div class="empty">${t('noAct')}</div>`}`},
list(){if(S.edit)return roomForm();
 return `<div class="row" style="margin-bottom:10px"><h3 style="margin:0">${t('myList')}</h3><button class="book" data-oadd>${t('add')}</button></div>`+(S.or.length?`<div class="list">${S.or.map(r=>`<article class="room"><div class="pic">${thumb(r)}</div><div class="info"><h3>${esc(r.t[0])}</h3><div class="loc">${esc(r.a)}, ${esc(cityName(r.c))}</div><div class="price">${inr(r.p)} · ${t('fDep')} ${inr(r.dep)}</div><div class="tags"><span>${t(r.type)}</span><span class="pill ${r.pub?'accepted':'cancelled'}">${t(r.pub?'published':'draft')}</span><span class="pill ${r.av!==false?'accepted':'rejected'}">${r.av!==false?t('avl'):t('unav')}</span></div><div class="acts"><button data-oed="${r.id}">${t('edit')}</button><button data-opub="${r.id}">${t(r.pub?'unpub':'pub')}</button><button data-oav="${r.id}">${t(r.av!==false?'markUn':'markAv')}</button><button class="dng" data-odel="${r.id}">${t('del')}</button></div></div></article>`).join('')}</div>`:`<div class="empty">${t('noList')}</div>`)},
book(){const bs=[...S.bookings].reverse().filter(b=>S.bf==='all'||b.status===S.bf),ST=['pending','accepted','rejected','cancelled'];
 return `<h3>${t('bkMgmt')}</h3><p class="demo">${t('bnote')}</p><div class="chips">${['all',...ST].map(k=>`<button class="chip ${S.bf===k?'on':''}" data-obf="${k}">${t(k)} (${k==='all'?S.bookings.length:S.bookings.filter(b=>b.status===k).length})</button>`).join('')}</div>`+
 (bs.length?`<div class="list">${bs.map(b=>`<article class="room bk"><div class="info"><div class="row"><h3>${esc(b.title)}</h3><span class="pill ${b.status}">${t(b.status)}</span></div><div class="loc">${esc(cityName(b.city))} · ${inr(b.amt)}${t('mo')} · ${t('fDep')} ${inr(b.dep)}</div><div class="loc">${t('cust1')}: ${esc(b.cust)} · ${t('contact')}: ${t('noContact')}</div><div class="loc">${t('reqOn')}: ${fdt(b.ts)}</div><div class="acts">${b.status==='pending'?`<button data-ost="${b.id}|accepted">${t('accept')}</button><button class="dng" data-ost="${b.id}|rejected">${t('reject')}</button>`:''}${active(b)?`<button class="dng" data-ost="${b.id}|cancelled">${t('cancel')}</button>`:''}<select data-ostsel="${b.id}" aria-label="${t('updSt')}"><option value="">${t('updSt')}</option>${ST.map(s=>`<option value="${s}">${t(s)}</option>`).join('')}</select></div></div></article>`).join('')}</div>`:`<div class="empty">${t('noBk')}</div>`)},
prof(){const p=S.op;return `<h3>${t('oprof')}</h3><div class="card">${p.photo?`<img class="av" id="p_prev" src="${p.photo}" alt="">`:`<div class="av" id="p_prev" style="display:grid;place-items:center">${svg('user')}</div>`}${fg(t('oPhoto'),'p_file','<input type="file" id="p_file" accept="image/png,image/jpeg,image/webp">')}${fg(t('oName'),'p_name',`<input id="p_name" maxlength="60" value="${esc(p.name)}">`)}${fg(t('oEmail'),'p_email',`<input id="p_email" type="email" maxlength="80" value="${esc(p.email)}">`)}${fg(t('oPhone'),'p_phone',`<input id="p_phone" inputmode="numeric" maxlength="10" value="${esc(p.phone)}">`)}${fg(t('oAddr'),'p_addr',`<textarea id="p_addr" rows="2" maxlength="200">${esc(p.addr)}</textarea>`)}<button class="go" data-opsave>${t('saveBtn')}</button></div>`},
rev(){const v=[...S.rv].reverse(),avg=v.length?Math.round(v.reduce((a,x)=>a+x.s,0)/v.length*10)/10:0;
 return `<h3>${t('reviews')}</h3><div class="ostats"><div><b>${v.length?avg+' ★':'—'}</b><span>${t('avg')} (${v.length})</span></div></div><h3>${t('revHist')}</h3>`+(v.length?v.map(x=>`<div class="nt"><b>${stars(x.s)}</b> ${esc(x.title)}<br>${esc(x.txt)}<br><small>${fdt(x.ts)}</small></div>`).join(''):`<div class="empty">${t('noRev')}</div>`)},
note(){const n=ownNotes();return `<h3>${t('notif')}</h3>`+(n.length?n.map(x=>`<div class="nt ${x.read?'':'u'}">${esc(x.t[L()])}<br><small>${fdt(x.ts)}</small></div>`).join('')+`<button class="ghost" style="width:100%" data-onread>${t('markOwn')}</button>`:`<div class="empty">${t('noNotif')}</div>`)},
earn(){const bs=[...S.bookings].reverse(),tot=bs.filter(b=>b.status==='accepted').reduce((a,b)=>a+b.amt+b.dep,0);
 return `<h3>${t('earn')}</h3><div class="demo">${t('payNote')}</div><div class="ostats"><div><b>${inr(tot)}</b><span>${t('total')}</span></div></div>`+(bs.length?bs.map(b=>`<div class="card"><div class="row"><b>${esc(b.title)}</b><span class="pill ${b.status}">${t(b.status)}</span></div>${inr(b.amt)} + ${t('fDep')} ${inr(b.dep)}<br><small>${fdt(b.ts)} · ${t('payNC')}</small></div>`).join(''):`<div class="empty">${t('noTx')}</div>`)}};
function ownerPage(){if(!S.oin)return `<div class="page"><h2>${t('ownerDash')}</h2><div class="demo">${t('gate')}</div><button class="go" id="ologin">${t('cont')}</button></div>`;
 const un=ownNotes().filter(n=>!n.read).length;
 return `<div class="odh"><button data-menu aria-label="${t('menu')}">${svg('menu')}</button><span>Alfrzo · ${t('ownerDash')}</span></div><div class="od"><nav class="onav" aria-label="${t('ownerDash')}">${OT.map(([k,l])=>`<button data-ot="${k}" class="${S.ot===k?'on':''}">${t(l)}${k==='note'&&un?` (${un})`:''}</button>`).join('')}<button class="lo" data-ologout>${t('logout')}</button></nav><section class="oc"><div class="demo">${t('odemo')}</div>${OV[S.ot]()}</section></div>`}
PAGES.owner=ownerPage;PAGES.list=()=>{S.ot='over';S.edit=null;S.tmpImg='';return ownerPage()};PAGES.customer=customerPage;PAGES.bookings=bookingsPage2;
function readImg(f,mx,cb){if(!f)return;if(!/^image\/(png|jpe?g|webp)$/.test(f.type))return toast(t('vImg'));const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.onerror=()=>toast(t('vImg'));im.src=fr.result};fr.readAsDataURL(f)}
document.addEventListener('click',e=>{const q=s=>e.target.closest(s);let el;
 if(q('#ologin')){S.oin=true;sv();return render()}
 if(q('[data-ologout]')){S.oin=false;S.edit=null;sv();go('home');return toast(t('logout'))}
 if(el=q('[data-ot]')){S.ot=el.dataset.ot;S.edit=null;S.tmpImg='';if(route()!=='owner')location.hash='/owner';else render();return window.scrollTo(0,0)}
 if(el=q('[data-ccan]'))return setStatus(el.dataset.ccan,'cancelled');
 if(el=q('[data-rev]')){const id=el.dataset.rev,b=S.bookings.find(x=>x.id===id);if(!b||S.rv.some(v=>v.bid===id))return;S.rv.push({id:'v'+Date.now(),bid:id,room:b.room,title:b.title,s:+$('#rs-'+id).value,txt:$('#rt-'+id).value.trim().slice(0,200),ts:Date.now()});ev('New review for '+b.title,b.title+' के लिए नया रिव्यू','o');persist();render();return toast(t('rvDone'))}
 if(q('[data-oadd]')){S.edit='new';S.tmpImg='';return render()}
 if(el=q('[data-oed]')){S.edit=+el.dataset.oed;const r=S.or.find(x=>x.id===S.edit);S.tmpImg=(r&&r.img)||'';return render()}
 if(q('[data-ocancel]')){S.edit=null;S.tmpImg='';return render()}
 if(q('[data-osave]'))return saveRoom();
 if(el=q('[data-opub]')){const r=S.or.find(x=>x.id===+el.dataset.opub);if(!r)return;r.pub=!r.pub;ev('Listing '+(r.pub?'published':'unpublished')+': '+r.t[0],'लिस्टिंग '+(r.pub?'पब्लिश':'अनपब्लिश')+': '+r.t[0],'o');persist();return render()}
 if(el=q('[data-oav]')){const r=S.or.find(x=>x.id===+el.dataset.oav);if(!r)return;r.av=r.av===false;ev('Listing marked '+(r.av?'available':'unavailable')+': '+r.t[0],'लिस्टिंग '+(r.av?'उपलब्ध':'अनुपलब्ध')+': '+r.t[0],'o');persist();return render()}
 if(el=q('[data-odel]'))return delRoom(+el.dataset.odel);
 if(el=q('[data-obf]')){S.bf=el.dataset.obf;return render()}
 if(el=q('[data-ost]')){const [id,st]=el.dataset.ost.split('|');return setStatus(id,st)}
 if(q('[data-onread]')){S.notes.forEach(n=>{if(n.role==='o')n.read=true});persist();return render()}
 if(q('[data-opsave]')){const g=i=>$('#'+i).value.trim(),e2={};if(g('p_name').length<2)e2.p_name='vName';if(g('p_email')&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g('p_email')))e2.p_email='vEmail';if(g('p_phone')&&!/^[6-9]\d{9}$/.test(g('p_phone')))e2.p_phone='vPhone';
  showErr(e2);if(Object.keys(e2).length)return toast(t('fix'));S.op={...S.op,name:g('p_name'),email:g('p_email'),phone:g('p_phone'),addr:g('p_addr')};sv();return toast(t('saved2'))}
});
document.addEventListener('change',e=>{const x=e.target;
 if(x.matches('[data-ostsel]')&&x.value)return setStatus(x.dataset.ostsel,x.value);
 if(x.name==='ph'){S.tmpImg='';const p=$('#f_prev');if(p)p.innerHTML=''}
 if(x.id==='f_file')readImg(x.files[0],480,d=>{S.tmpImg=d;document.querySelectorAll('input[name=ph]').forEach(r=>r.checked=false);$('#f_prev').innerHTML=`<img src="${d}" alt="" style="width:90px;border-radius:10px;margin-top:6px">`});
 if(x.id==='p_file')readImg(x.files[0],200,d=>{S.op.photo=d;sv();render()})});
render();
})();
</script>
</body>
</html>
