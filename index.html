<style>
:root{--ink:#14183a;--muted:#6b7090;--purple:#5b3df5;--pink:#e830e8;--blue:#2f45ff;--bg:#f6f5fc;--card:#fff;--line:#e9e8f3;--w:430px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}

button,select,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.app{max-width:var(--w);min-height:100vh;margin:0 auto;background:var(--bg);position:relative;padding-bottom:84px;overflow:hidden}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.search{margin:-46px 14px 0;background:#fff;border-radius:22px;padding:14px;box-shadow:0 14px 40px rgba(40,30,120,.16);position:relative;z-index:3}
.field{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;height:48px;margin-bottom:10px;background:#fff}

.go{width:100%;height:50px;border-radius:14px;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(90deg,#2f45ff,#e830e8);box-shadow:0 8px 20px rgba(120,50,255,.35)}

.cities{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.cities::-webkit-scrollbar{display:none}
.city{flex:0 0 96px;height:96px;border-radius:14px;color:#fff;font-size:12px;font-weight:700;position:relative;overflow:hidden;border:2px solid transparent;padding:0;background:#2a1d6e;transition:transform .15s}
.city:active{transform:scale(.96)}
.city img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.city span{position:absolute;left:0;right:0;bottom:7px;z-index:2;text-align:center}
.city.on{border-color:var(--purple)}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
.cgrid .city{width:100%;height:120px;flex:none}
.cgrid .city span{font-size:14px}
.note{margin:0 16px 8px;font-size:11.5px;color:var(--muted)}
.list{padding:0 14px;display:grid;gap:10px}
.room{display:flex;gap:12px;background:#fff;border-radius:16px;padding:8px;box-shadow:0 4px 16px rgba(40,30,120,.06)}
.pic{flex:0 0 126px;height:112px;border-radius:12px;position:relative;overflow:hidden}

.heart{position:absolute;top:7px;right:7px;color:#fff}

.heart.on svg{fill:#ff3d77;stroke:#ff3d77}
.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:2px 2px 2px 0}
.info h3{margin:0;font-size:15px;font-weight:700}

.tags{display:flex;gap:6px;flex-wrap:wrap}

.row{display:flex;justify-content:space-between;align-items:center}
.rate{font-size:12.5px;font-weight:700}

.page{padding:22px 16px 8px}
.page h2{margin:0 0 14px;font-size:22px;font-weight:800}
.page p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 10px}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
.toast{position:fixed;bottom:96px;left:50%;transform:translate(-50%,20px);background:#14183a;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.prof{display:grid;gap:10px}
.prof div{background:#fff;border-radius:14px;padding:14px;font-weight:600}
/* interactive map */
.map-wrap{padding:0 14px 18px}.map-toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:0 0 10px}.map-toolbar select{min-width:0;flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:#fff}.map-canvas{height:390px;border-radius:18px;overflow:hidden;background:#e9e7f5;z-index:1}.map-note{font-size:12px;color:var(--muted);padding:8px 2px}.map-link{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:11px;font-weight:700;color:var(--purple);text-decoration:none;background:#fff}.coord-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.map-actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
/* filters */
.fp{margin:0 14px;background:#fff;border-radius:22px;padding:14px;box-shadow:0 14px 40px rgba(40,30,120,.12)}
.fp h4{margin:6px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1.5px solid var(--line);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600;background:#fff}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}
.btns .go{height:46px}
.ghost{height:46px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;background:#fff}
.sortbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 16px 10px;font-size:13px;font-weight:600}
.sortbar select{border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff;font-size:13px}
.spin{width:30px;height:30px;border:3px solid #e1ddf8;border-top-color:var(--purple);border-radius:50%;margin:40px auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:112px;border-radius:16px;background:linear-gradient(90deg,#ece9fa,#f7f5ff,#ece9fa);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* drawer + sheet */
.ov{position:fixed;inset:0;background:rgba(20,14,60,.55);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.ov.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:max(0px,calc(50% - var(--w)/2));width:min(310px,86vw);background:#fff;z-index:21;transform:translateX(-105%);transition:transform .25s;display:flex;flex-direction:column;visibility:hidden}
.drawer.show{transform:none;visibility:visible}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;background:linear-gradient(120deg,#2a1d6e,#7a3fc0);color:#fff}
.dh .logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800}
.dh button{color:#fff}
.dn{overflow-y:auto;flex:1;padding:8px 8px 24px;overscroll-behavior:contain}
.dn button{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;font-weight:600;font-size:15px}
.dn button:active,.dn button:hover{background:#f1effb}
.dn hr{border:0;border-top:1px solid var(--line);margin:8px 6px}
.dn .lg{display:flex;gap:8px;padding:10px 14px}
.dn .lg button{width:auto;padding:8px 16px;border:1.5px solid var(--line);border-radius:20px;font-size:14px}
.dn .lg button.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:var(--w);background:#fff;border-radius:22px 22px 0 0;z-index:22;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));transition:transform .25s;visibility:hidden;max-height:70vh;overflow-y:auto}
.sheet.show{transform:translate(-50%,0);visibility:visible}
.sheet h3{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.nt{padding:12px;border-radius:12px;background:#f6f5fc;margin-bottom:8px;font-size:14px}
.nt.u{border-left:4px solid var(--purple)}
body.lock{overflow:hidden}
.demo{background:#fff6dd;border:1px solid #f1d98a;color:#6b5200;border-radius:12px;padding:10px 12px;font-size:12.5px;margin:0 0 12px;line-height:1.45}
.odh{display:flex;align-items:center;gap:10px;padding:14px 14px 0;font-weight:800;font-size:17px}.odh button{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#fff}
.od{padding:14px 14px 8px}.onav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.onav::-webkit-scrollbar{display:none}
.onav button{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px}
.onav button.on{background:var(--purple);border-color:var(--purple);color:#fff}.onav .lo{color:#c0224f;border-color:#f3c3d0}
.oc{min-width:0}.oc h3{margin:14px 0 8px;font-size:17px}.oc .list{padding:0}
.ostats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.ostats div{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 16px rgba(40,30,120,.06)}
.ostats b{display:block;font-size:24px}.ostats span{font-size:12px;color:var(--muted);font-weight:600}
.pill{display:inline-block;border-radius:10px;padding:3px 9px;font-size:11px;font-weight:700;background:#eee;white-space:nowrap}
.pill.pending{background:#fff1d6;color:#8a5a00}.pill.accepted{background:#dff5ea;color:#0f7a45}.pill.rejected{background:#ffe3e8;color:#b0214a}.pill.cancelled{background:#ececf3;color:#555}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.acts button,.acts select{border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;background:#fff}.acts .dng,.dng{color:#c0224f;border-color:#f3c3d0}
.acts .book{background:var(--purple);border-color:var(--purple);color:#fff}
/* My Profile (logged-in) */
.pf{padding:18px 16px 8px}.pf-h{margin:0 0 14px;font-size:22px;font-weight:800}
.pf-hd{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 16px rgba(40,30,120,.06);margin-bottom:12px}
.pf-avw{position:relative;display:block;flex:0 0 auto;cursor:pointer}
.pf-av{position:relative;display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#7a5bff,#c13bff);color:#fff;font-size:28px;font-weight:800}

.pf-ro{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#f8f7fd;font-size:15px}.pf-ro span{flex:1;min-width:0;overflow-wrap:anywhere}.pf-ro svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}

.phs{display:flex;gap:8px;flex-wrap:wrap}.phs label{position:relative;cursor:pointer;border:2px solid transparent;border-radius:10px;overflow:hidden;width:72px;height:58px;margin:0}

<body>
<div class="app">
  <main id="view"><div class="spin" role="status" aria-label="Loading"></div></main>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';
/* ---------- Supabase: read-only connection test (no writes, no auth) ---------- */
try{
  if(!window.ROOMLY_SUPABASE_URL||!window.ROOMLY_SUPABASE_KEY){
    console.warn('[Alfrzo] Supabase config missing; continuing with demo data.');
  }else{
    var sbScript=document.createElement('script');
    sbScript.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
    sbScript.async=true;
    sbScript.onload=async function(){
      try{
        if(!window.supabase||typeof window.supabase.createClient!=='function'){console.error('[Alfrzo] Supabase client failed to load.');authOff();return}
        if(keyIsSecret(window.ROOMLY_SUPABASE_KEY)){console.error('[Alfrzo] Refusing to use a service_role/secret key in the browser. Use the anon/publishable key only.');authOff();return}
        if(!window.supabaseClient){window.supabaseClient=window.supabase.createClient(window.ROOMLY_SUPABASE_URL,window.ROOMLY_SUPABASE_KEY)}
        authInit();
        const {count,error}=await window.supabaseClient.from('rooms').select('id',{count:'exact',head:true});
        if(error){console.error('[Alfrzo] Supabase read-only rooms check failed:',error)}
        else{console.log('[Alfrzo] Supabase read-only rooms check passed. Room count:',count)}
      }catch(e){console.error('[Alfrzo] Supabase check threw:',e&&e.message?e.message:e)}
    };
    sbScript.onerror=function(){console.error('[Alfrzo] Failed to load Supabase client from CDN.');authOff()};
    document.head.appendChild(sbScript);
  }
}catch(e){console.error('[Alfrzo] Supabase loader error:',e)}

 <div class="pf-tiles"><button type="button" data-go="saved">${svg('heart')}<span>${t('pfSaved')}</span><b>${S.saved.size}</b></button><button type="button" data-go="bookings">${svg('book')}<span>${t('pfBook')}</span><b>${nb}</b></button><button type="button" data-pf="soon">${svg('msg')}<span>${t('pfMsgs')}</span><b>—</b></button><button type="button" data-pf="soon">${svg('wallet')}<span>${t('pfPay')}</span><b>—</b></button></div>
 <div class="pf-menu">${pfRow('user',t('pfPersonal'),'','data-pf="edit"')}${pfRow('idc',t('pfAddr'),'','data-pf="soon"',soon)}${pfRow('heart',t('pfPref'),t('pfPrefSub'),'data-go="search"')}${pfRow('globe',t('pfLang'),'English / हिन्दी',`data-lang="${S.lang==='hi'?'en':'hi'}"`)}${pfRow('help',t('pfHelp'),'','data-go="help"')}${pfRow('shield',t('pfPriv'),'','data-go="privacy"')}${pfRow('out',t('aLogout'),'','data-alogout','','out')}</div></div>`}
function pfEditView(){
 const m=pfMeta(),ver=!!S.user.email_confirmed_at,g=m.gender||'',today=new Date().toISOString().slice(0,10);
 const rd=(v,k)=>`<label class="pf-rd"><input type="radio" name="pf_gender" value="${v}" ${g===v?'checked':''}><span>${t(k)}</span></label>`;
 return `<div class="pf"><div class="pf-top"><button type="button" class="pf-bk" data-pf="back" aria-label="${t('pfBack')}">${svg('back')}</button><h2>${t('pfEdit')}</h2><button type="submit" form="pf-form" class="pf-save" id="pf-save">${t('pfSave')}</button></div>
 <form id="pf-form" novalidate>
  <div class="pf-ph"><label class="pf-avw" for="pf_file">${pfAv('big')}<span class="pf-cam">${svg('camera')}</span></label><b>${t('pfChPhoto')}</b><small>${t('pfPhotoHint')}</small><input id="pf_file" class="pf-file" type="file" accept="image/png,image/jpeg"><small class="ferr" id="pf-ferr"></small></div>
  ${fg(t('pfName'),'pf_name',`<input id="pf_name" type="text" maxlength="60" autocomplete="name" value="${esc(String(m.full_name||''))}">`)}
  <div class="fg"><label>${t('pfEmail')}</label><div class="pf-ro">${svg('mail')}<span>${esc(S.user.email||'')}</span><span class="pf-pill ${ver?'ok':'no'}" style="flex:0 0 auto">${ver?svg('tick'):''}${t(ver?'pfVerified':'pfUnverified')}</span></div></div>
  ${fg(t('pfPhone'),'pf_phone',`<input id="pf_phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="+91 98765 43210" value="${esc(String(m.phone||''))}">`)}
  <div class="pf-note">${t('pfPhoneNote')}</div>
  ${fg(t('pfDob'),'pf_dob',`<input id="pf_dob" type="date" min="1900-01-01" max="${today}" value="${esc(String(m.dob||''))}">`)}
  <div class="fg"><label>${t('pfGender')}</label><div class="pf-rds">${rd('male','pfMale')}${rd('female','pfFemale')}${rd('other','pfOther')}</div></div>
  <div id="pf-msg" role="alert" aria-live="polite"></div></form></div>`}
const pfOrig=PAGES.profile;
PAGES.profile=function(){if(!S.user||S.ast!=='ready'){if(S.pedit)pfReset();return pfOrig()}return S.pedit?pfEditView():pfView()};
function pfMsg(txt,ok){const m=$('#pf-msg');if(m)m.innerHTML=txt?`<div class="nt${ok?' u':''}" style="${ok?'':'border-left:4px solid #c0224f;'}margin-top:4px">${esc(txt)}</div>`:''}
function pfStorErr(e){const m=String((e&&e.message)||'').toLowerCase(),st=Number(e&&(e.statusCode||e.status));
 if(m.includes('bucket not found'))return 'pfErrBucket';
 if(m.includes('row-level security')||m.includes('unauthorized')||st===401||st===403)return 'pfErrPerm';
 if(m.includes('exceeded')||m.includes('too large')||m.includes('mime')||st===413)return 'pfErrSize';
 if(m.includes('fetch')||m.includes('network'))return 'aErrNet';
 return 'aErrGen'}
function pfPick(inp){const f=inp.files&&inp.files[0],er=$('#pf-ferr');if(er)er.textContent='';if(!f)return;
 const bad=k=>{if(er)er.textContent=t(k);inp.value=''};
 if(!/^image\/(jpeg|png)$/.test(f.type))return bad('vPfImgT');
 if(f.size>PF_MAXB)return bad('vPfImgS');
 const url=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{const k=Math.min(1,512/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
  c.toBlob(b=>{if(!b)return bad('vPfImgT');S.pblob=b;if(S.pprev){try{URL.revokeObjectURL(S.pprev)}catch(e){}}S.pprev=URL.createObjectURL(b);
   const a=$('#pf-av');if(a){const o=a.querySelector('img');if(o)o.remove();const i=document.createElement('img');i.src=S.pprev;i.alt='';a.appendChild(i)}toast(t('pfPhotoOk'))},'image/jpeg',.85)};
 im.onerror=()=>{URL.revokeObjectURL(url);bad('vPfImgT')};im.src=url}
async function pfSave(){const c=sb();if(!c||!S.user||S.pbusy)return;
 const v=id=>{const e=$('#'+id);return e?e.value.trim():''},name=v('pf_name').replace(/\s+/g,' '),raw=v('pf_phone').replace(/[\s-]/g,''),dob=v('pf_dob'),gs=document.querySelector('input[name=pf_gender]:checked'),gender=gs?gs.value:'',er={};
 if(name.length<2||name.length>60)er.pf_name='vPfName';
 let phone='';if(raw){const d=raw.replace(/^\+?91(?=\d{10}$)/,'').replace(/^0(?=\d{10}$)/,'');if(/^[6-9]\d{9}$/.test(d))phone='+91'+d;else er.pf_phone='vPfPhone'}
 if(dob){const d=new Date(dob+'T00:00:00');if(isNaN(d)||d>new Date()||d.getFullYear()<1900)er.pf_dob='vPfDob'}
 showErr(er);if(Object.keys(er).length)return;
 S.pbusy=true;const b=$('#pf-save');if(b)b.disabled=true;pfMsg('');
 let avatar=String(pfMeta().avatar_url||''),photoErr='';
 try{
  if(S.pblob){try{const path=S.user.id+'/avatar.jpg',up=await c.storage.from('avatars').upload(path,S.pblob,{contentType:'image/jpeg',upsert:true,cacheControl:'3600'});if(up&&up.error)throw up.error;
    const pu=c.storage.from('avatars').getPublicUrl(path);avatar=pu.data.publicUrl+'?v='+Date.now();S.pblob=null}
   catch(x){photoErr=t(pfStorErr(x));console.warn('[Alfrzo] photo upload failed:',(x&&(x.message||x.code))||x)}}
  const {data,error}=await c.auth.updateUser({data:{full_name:name,phone,dob,gender,avatar_url:avatar}});if(error)throw error;
  if(data&&data.user)S.user=data.user;
  if(photoErr){toast(t('pfSavedOk'));pfMsg(t('pfPhotoFail')+' '+photoErr)}
  else{pfReset();toast(t('pfSavedOk'));render()}
 }catch(x){console.warn('[Alfrzo] profile save error:',(x&&(x.code||x.message))||x);pfMsg(t(aerr(x)))}
 finally{S.pbusy=false;const b2=$('#pf-save');if(b2)b2.disabled=false}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-pf]');if(!el)return;const a=el.dataset.pf;
 if(a==='edit'){S.pedit=true;render();return window.scrollTo(0,0)}
 if(a==='back'){pfReset();render();return window.scrollTo(0,0)}
 if(a==='soon')return toast(t('pfSoonT'))});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='pf_file')pfPick(e.target)});
document.addEventListener('submit',e=>{const f=e.target;if(f&&f.id==='pf-form'){e.preventDefault();pfSave()}});
/* ===== ALFRZO LIVE DATA (Supabase) — PART 1: rooms ===== */
const SAMPLE_ROOMS=ROOMS.slice(),PROTO0=T.proto,BOOKDONE0=T.bookDone,TXT0={cdemo:T.cdemo,bnote:T.bnote,odemo:T.odemo};
const A_MAP={ac:'ac',wifi:'wifi','wi-fi':'wifi',bathroom:'bath','attached bathroom':'bath',bath:'bath',parking:'parking',security:'security',power:'power','power backup':'power',laundry:'laundry'};
const normType=x=>{x=String(x||'Single');if(TYPES.includes(x))return x;const y=x.replace(/\s*room$/i,'');return TYPES.includes(y)?y:x};
function dbToRoom(r,mine){const ttl=r.title||'Room';
 return {id:r.id,t:[ttl,ttl],a:r.area||'',addr:r.address||'',c:r.city||'',p:+r.rent||0,dep:+r.deposit||0,type:normType(r.type),furn:FURN.includes(r.furnishing)?r.furnishing:'Furnished',food:FOOD.includes(r.food)?r.food:'NotAvailable',g:(r.gender==='Male'||r.gender==='Female')?r.gender:'Any',am:[...new Set((r.facilities||[]).map(x=>A_MAP[String(x).toLowerCase()]).filter(Boolean))],r:0,n:0,d:String(r.created_at||'').slice(0,10),desc:r.description||'',img:(r.image_url&&/^(https:\/\/|data:image\/)/.test(r.image_url))?r.image_url:'',ph:1,lat:r.latitude,lng:r.longitude,pub:r.status!=='draft',av:r.status==='active',own:!!mine,db:true}}
function softRender(){if(S.edit)return;const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;try{render()}catch(e){}}
async function loadLive(){const c=sb();if(!c)return;
 try{const {data,error}=await c.from('rooms').select('*').order('created_at',{ascending:false});if(error)throw error;
  const uid=S.user&&S.user.id,rows=data||[];
  const pubRows=rows.filter(r=>r.status==='active').map(r=>dbToRoom(r,false));
  const mine=uid?rows.filter(r=>r.user_id===uid).map(r=>dbToRoom(r,true)):[];
  const mineIds=new Set(mine.map(r=>r.id));
  S.live=rows.length>0;
  if(S.live){ROOMS.splice(0,ROOMS.length,...pubRows.filter(r=>!mineIds.has(r.id)));S.or=mine}
  else{ROOMS.splice(0,ROOMS.length,...SAMPLE_ROOMS)}
  T.proto=S.live?['Live listings from Alfrzo owners.','Alfrzo ओनर्स की लाइव लिस्टिंग।']:PROTO0;
  T.cdemo=S.live?['Your booking requests. The owner accepts or rejects them.','आपके बुकिंग अनुरोध। ओनर इन्हें स्वीकार या अस्वीकार करता है।']:TXT0.cdemo;
  T.bnote=S.live?['Requests for your listed rooms.','आपके रूम के लिए आए अनुरोध।']:TXT0.bnote;
  T.odemo=S.live?['Log in from the menu to save listings to the live database.','लाइव डेटाबेस में लिस्टिंग सेव करने के लिए मेनू से लॉगिन करें।']:TXT0.odemo;
  T.bookDone=S.live?['Booking request sent to the owner.','बुकिंग अनुरोध ओनर को भेज दिया गया।']:BOOKDONE0;
 }catch(e){console.warn('[Alfrzo] live rooms failed:',e&&e.message||e)}}

/* ===== ALFRZO LIVE DATA (Supabase) — PART 2: bookings + favorites + login hook ===== */
async function loadBookings(){const c=sb();if(!c||!S.live)return;
 if(!S.user){S.bookings=[];return}
 const {data,error}=await c.from('booking_requests').select('id,room_id,user_id,status,created_at,rooms(title,city,rent,deposit,user_id)').order('created_at',{ascending:false});
 if(error){console.warn('[Alfrzo] bookings failed:',error.message);return}
 const me=S.user.id;
 S.bookings=(data||[]).map(x=>{const rm=x.rooms||{};return {id:'d'+x.id,dbId:x.id,room:x.room_id,title:rm.title||('Room #'+x.room_id),city:rm.city||'',amt:+rm.rent||0,dep:+rm.deposit||0,status:x.status,ts:Date.parse(x.created_at)||Date.now(),cust:x.user_id===me?'You':'Customer',mine:x.user_id===me,owned:rm.user_id===me}}).reverse()}
async function loadFavs(){const c=sb();if(!c||!S.live||!S.user)return;
 const {data,error}=await c.from('favorites').select('room_id');if(error)return;
 const have=new Set((data||[]).map(x=>x.room_id)),local=[...S.saved].filter(id=>ALLO().some(r=>r.id===id&&r.db)&&!have.has(id));
 if(local.length){await c.from('favorites').upsert(local.map(room_id=>({room_id,user_id:S.user.id})),{onConflict:'user_id,room_id',ignoreDuplicates:true});local.forEach(id=>have.add(id))}
 S.saved=new Set(have)}
async function loadAll(){await loadLive();await loadBookings();await loadFavs();softRender()}
const _bookRoom=bookRoom;
bookRoom=async function(id){
 if(!S.live||!ALLO().some(r=>r.id===id&&r.db))return _bookRoom(id);
 const c=sb();if(!c)return toast(t('aErrNet'));
 if(!S.user){toast(t('aMenuIn'));return go('auth')}
 const r=ALLO().find(x=>x.id===id);if(r&&r.av===false)return toast(t('unav'));
 if(S.bookings.some(b=>b.room===id&&b.mine&&active(b)))return toast(t('bookDup'));
 const {error}=await c.from('booking_requests').insert({room_id:id,user_id:S.user.id});
 if(error){console.warn('[Alfrzo] booking failed:',error.message);return toast(t('aErrGen'))}
 await loadBookings();render();toast(t('bookDone'))};
const _setStatus=setStatus;
setStatus=async function(id,st){const b=S.bookings.find(x=>x.id===id);if(!b||!b.dbId)return _setStatus(id,st);
 if(b.status===st)return;const c=sb();if(!c)return;
 const {error}=await c.from('booking_requests').update({status:st}).eq('id',b.dbId);
 if(error){console.warn('[Alfrzo] status failed:',error.message);return toast(t('aErrGen'))}
 await loadBookings();render();toast((T[st]||[st,st])[L()])};
function withBk(fn,pick){return function(){if(!S.live||!S.user)return fn.apply(this,arguments);const all=S.bookings;S.bookings=all.filter(pick);try{return fn.apply(this,arguments)}finally{S.bookings=all}}}
PAGES.bookings=withBk(PAGES.bookings,b=>b.mine!==false);
['over','book','earn'].forEach(k=>{OV[k]=withBk(OV[k],b=>b.owned!==false)});
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-save]');if(!el||!S.live||!S.user)return;
 const id=+el.dataset.save,c=sb();if(!c||!ALLO().some(r=>r.id===id&&r.db))return;
 const q=S.saved.has(id)?c.from('favorites').upsert({room_id:id,user_id:S.user.id},{onConflict:'user_id,room_id',ignoreDuplicates:true}):c.from('favorites').delete().eq('room_id',id).eq('user_id',S.user.id);
 q.then(({error})=>{if(error)console.warn('[Alfrzo] favorite sync failed:',error.message)})});
let lastUid;
const _refreshAuthUI=refreshAuthUI;
refreshAuthUI=function(f){_refreshAuthUI(f);const uid=S.user?S.user.id:null;if(S.ast==='ready'&&uid!==lastUid){lastUid=uid;loadAll()}};

/* ===== ALFRZO LIVE DATA (Supabase) — PART 3: owner listings ===== */
const roomToDb=o=>({title:o.t[0],area:o.a,address:o.addr||null,city:o.c,rent:o.p,deposit:o.dep,type:o.type,furnishing:o.furn,food:o.food,gender:o.g,facilities:o.am,description:o.desc||null,image_url:o.img||null,latitude:o.lat,longitude:o.lng,phone:(S.op&&S.op.phone)||'',status:!o.pub?'draft':(o.av===false?'unavailable':'active')});
async function pushRoom(o,isNew){const c=sb();if(!c)return;
 const row=roomToDb(o),res=isNew?await c.from('rooms').insert({...row,user_id:S.user.id}):await c.from('rooms').update(row).eq('id',o.id);
 if(res.error){console.warn('[Alfrzo] room save failed:',res.error.message);toast(t('aErrGen'))}
 await loadAll()}
const _saveRoom=saveRoom;
saveRoom=async function(){const wasNew=S.edit==='new',eid=S.edit;_saveRoom();
 if(S.edit!==null||!S.user||!sb())return;
 const o=wasNew?S.or[S.or.length-1]:S.or.find(x=>x.id===eid);if(!o)return;
 await pushRoom(o,wasNew||!o.db)};
const _delRoom=delRoom;
delRoom=async function(id){const o=S.or.find(x=>x.id===id),had=!!(o&&o.db);_delRoom(id);
 if(!had||S.or.some(x=>x.id===id)||!S.user||!sb())return;
 const {error}=await sb().from('rooms').delete().eq('id',id);
 if(error){console.warn('[Alfrzo] delete failed:',error.message);toast(t('aErrGen'))}
 await loadAll()};
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-opub],[data-oav]');if(!el||!S.user||!sb())return;
 const id=+(el.dataset.opub||el.dataset.oav),o=S.or.find(x=>x.id===id);if(!o||!o.db)return;
 sb().from('rooms').update({status:!o.pub?'draft':(o.av===false?'unavailable':'active')}).eq('id',id).then(({error})=>{if(error){console.warn('[Alfrzo] status save failed:',error.message);toast(t('aErrGen'))}return loadAll()})});

render();
})();
