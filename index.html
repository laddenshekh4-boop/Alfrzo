document.addEventListener('click',e=>{
  const q=s=>e.target.closest(s);let el;
  if(q('[data-close]')||e.target.id==='ov')return closeAll();
  if(q('[data-menu]'))return open($('#drawer'));
  if(q('[data-notif]'))return open($('#sheet'));
  if(el=q('[data-tab]'))return go(el.dataset.tab);
  if(el=q('[data-go]'))return go(el.dataset.go);
  if(el=q('[data-city]')){const n=el.dataset.city;S.city=n;S.F.city=n;persist();if(S.route==='cities'){go('search');applySearch();return}render();return toast(cityName(n))}
  if(el=q('[data-save]')){const id=+el.dataset.save;S.saved.has(id)?S.saved.delete(id):S.saved.add(id);persist();toast(S.saved.has(id)?t('saveOn'):t('saveOff'));return render()}
  if(el=q('[data-book]')){return toast(t('bookDone'))}
  if(el=q('[data-am]')){el.classList.toggle('on');el.setAttribute('aria-pressed',el.classList.contains('on'));return}
  if(q('#go')){S.F={...S.F,city:$('#city').value,budget:$('#budget').value,type:$('#type').value};if(S.F.city)S.city=S.F.city;persist();if(location.hash==='#/search')render();else location.hash='/search';return}
  if(q('#apply')){readFilters();return applySearch()}
  if(q('#clr')){S.F={...blank};persist();return applySearch()}
});
document.addEventListener('change',e=>{if(e.target.id==='sort'){S.sort=e.target.value;render()} });
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
render();
})();
</script>
</body>
</html>
